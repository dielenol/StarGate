name: Deploy bots

on:
  push:
    branches: [main]
    paths:
      - 'registra-bot/**'
      - 'trpg-bot/**'
      - 'stargate-worker/**'
      - 'packages/core/**'
      - 'packages/shared-db/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/deploy-bots.yml'
  workflow_dispatch:
    inputs:
      target:
        description: '수동 배포 대상'
        required: true
        type: choice
        options:
          - registra
          - trpg
          - worker-shadow
      confirm_worker_shadow_mode:
        description: 'worker-shadow 선택 시 Dokploy WORKER_MODE=shadow 확인'
        required: false
        default: false
        type: boolean

concurrency:
  group: deploy-bots-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ------------------------------------------------------------
  # 어떤 장기 실행 서비스가 변경됐는지 감지 → 해당 서비스만 배포
  # ------------------------------------------------------------
  detect-changes:
    name: Detect changed services
    runs-on: ubuntu-latest
    outputs:
      registra: ${{ steps.filter.outputs.registra }}
      trpg: ${{ steps.filter.outputs.trpg }}
      worker: ${{ steps.filter.outputs.worker }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            registra:
              - 'registra-bot/**'
              - 'packages/shared-db/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
            trpg:
              - 'trpg-bot/**'
              - 'packages/shared-db/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
            worker:
              - 'stargate-worker/**'
              - 'packages/core/**'
              - 'packages/shared-db/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/deploy-bots.yml'

  # ------------------------------------------------------------
  # registra-bot 배포 (Dokploy webhook 호출)
  # ------------------------------------------------------------
  deploy-registra:
    name: Deploy registra-bot
    needs: detect-changes
    if: |
      (github.event_name == 'push' && needs.detect-changes.outputs.registra == 'true') ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'registra')
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Dokploy deploy (registra-bot)
        env:
          WEBHOOK_URL: ${{ secrets.DOKPLOY_REGISTRA_WEBHOOK }}
          CHANGED_PATH: registra-bot/package.json
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "❌ DOKPLOY_REGISTRA_WEBHOOK secret이 설정되지 않았습니다."
            echo "→ Dokploy → registra-bot → Deployments → Webhook URL 을 복사해서"
            echo "  GitHub repo → Settings → Secrets → Actions 에 등록하세요."
            exit 1
          fi
          payload="$(jq -nc \
            --arg ref "$GITHUB_REF" \
            --arg sha "$GITHUB_SHA" \
            --arg message "GitHub Actions deploy: $GITHUB_WORKFLOW" \
            --arg path "$CHANGED_PATH" \
            '{ref: $ref, head_commit: {id: $sha, message: $message}, commits: [{modified: [$path]}]}'
          )"
          curl -fsSL -X POST \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Event: push" \
            --data "$payload" \
            "$WEBHOOK_URL"
          echo "✅ registra-bot deploy triggered"

  # ------------------------------------------------------------
  # trpg-bot 배포
  # ------------------------------------------------------------
  deploy-trpg:
    name: Deploy trpg-bot
    needs: detect-changes
    if: |
      (github.event_name == 'push' && needs.detect-changes.outputs.trpg == 'true') ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'trpg')
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Dokploy deploy (trpg-bot)
        env:
          WEBHOOK_URL: ${{ secrets.DOKPLOY_TRPG_WEBHOOK }}
          CHANGED_PATH: trpg-bot/package.json
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "❌ DOKPLOY_TRPG_WEBHOOK secret이 설정되지 않았습니다."
            echo "→ Dokploy → trpg-bot → Deployments → Webhook URL 을 복사해서"
            echo "  GitHub repo → Settings → Secrets → Actions 에 등록하세요."
            exit 1
          fi
          payload="$(jq -nc \
            --arg ref "$GITHUB_REF" \
            --arg sha "$GITHUB_SHA" \
            --arg message "GitHub Actions deploy: $GITHUB_WORKFLOW" \
            --arg path "$CHANGED_PATH" \
            '{ref: $ref, head_commit: {id: $sha, message: $message}, commits: [{modified: [$path]}]}'
          )"
          curl -fsSL -X POST \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Event: push" \
            --data "$payload" \
            "$WEBHOOK_URL"
          echo "✅ trpg-bot deploy triggered"

  # ------------------------------------------------------------
  # stargate-worker 배포
  # ------------------------------------------------------------
  deploy-worker:
    name: Deploy stargate-worker
    needs: detect-changes
    if: |
      (github.event_name == 'push' && needs.detect-changes.outputs.worker == 'true') ||
      (github.event_name == 'workflow_dispatch' &&
       inputs.target == 'worker-shadow' &&
       inputs.confirm_worker_shadow_mode == true)
    runs-on: ubuntu-latest
    environment: stargate-worker-deploy
    steps:
      - name: Trigger Dokploy deploy (stargate-worker)
        env:
          WEBHOOK_URL: ${{ secrets.DOKPLOY_STARGATE_WORKER_WEBHOOK }}
          CHANGED_PATH: stargate-worker/package.json
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "❌ DOKPLOY_STARGATE_WORKER_WEBHOOK secret이 설정되지 않았습니다."
            echo "→ Dokploy → stargate-worker → Deployments → Webhook URL 을 복사해서"
            echo "  GitHub repo → Settings → Secrets → Actions 에 등록하세요."
            exit 1
          fi
          payload="$(jq -nc \
            --arg ref "$GITHUB_REF" \
            --arg sha "$GITHUB_SHA" \
            --arg message "GitHub Actions deploy: $GITHUB_WORKFLOW" \
            --arg path "$CHANGED_PATH" \
            '{ref: $ref, head_commit: {id: $sha, message: $message}, commits: [{modified: [$path]}]}'
          )"
          curl -fsSL -X POST \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Event: push" \
            --data "$payload" \
            "$WEBHOOK_URL"
          echo "✅ stargate-worker deploy triggered"
